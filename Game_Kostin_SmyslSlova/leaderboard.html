<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лидерборд - Смысл Слова</title>
  
  <!-- Подключаем общие стили -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ========== АНИМИРОВАННЫЙ ФОН ========== -->
  <div id="large-header" class="large-header">
    <canvas id="demo-canvas"></canvas>
  </div>

  <!-- ========== ПЕРЕКЛЮЧАТЕЛЬ ТЕМ ========== -->
  <div class="theme-switcher" id="theme-switcher">
    <button class="theme-btn active" data-theme="dark" title="Тёмная тема">🌙</button>
    <button class="theme-btn" data-theme="light" title="Светлая тема">☀️</button>
    <button class="theme-btn" data-theme="purple" title="Фиолетовая тема">💜</button>
    <button class="theme-btn" data-theme="blue" title="Синяя тема">🔷</button>
  </div>

  <!-- ========== ОСНОВНОЙ КОНТЕЙНЕР ========== -->
  <div class="container">
    
    <!-- ========== ЗАГОЛОВОК ========== -->
    <h1 class="main-title">
      <span class="title-main">ТАБЛИЦА ЛИДЕРОВ</span>
      <span class="title-sub">Лучшие игроки и их достижения</span>
    </h1>

    <!-- ========== КАРТОЧКА С ТАБЛИЦЕЙ ========== -->
    <div class="card" style="display: flex; flex-direction: column; min-height: 0;">
      
      <!-- ===== ПАНЕЛЬ УПРАВЛЕНИЯ ===== -->
      <div style="margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;">
        
        <!-- Кнопка возврата в меню -->
        <button class="btn" onclick="window.location.href='index.html'">
          ← Назад в меню
        </button>
        
        <!-- Кнопка экспорта данных -->
        <button class="btn" style="background:var(--secondary)" onclick="exportLeaderboard()">
          📤 Экспорт данных
        </button>
        
        <!-- Кнопка импорта данных (скрытый input) -->
        <button class="btn" style="background:var(--primary)" onclick="document.getElementById('importFile').click()">
          📥 Импорт данных
        </button>
        
        <!-- Кнопка очистки таблицы -->
        <button class="btn" style="background:var(--accent)" onclick="clearLeaderboard()">
          🗑️ Очистить таблицу
        </button>
        
        <!-- Скрытый input для загрузки файла -->
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importLeaderboard(event)">
      </div>

      <!-- ===== КОНТЕЙНЕР ДЛЯ ТАБЛИЦЫ ===== -->
      <!-- Сюда будет загружена таблица через JavaScript -->
      <div id="leaderboard-container" style="flex: 1; min-height: 300px;">
        <div class="loading-text">Загрузка таблицы лидеров...</div>
      </div>

      <!-- ===== КОНТЕЙНЕР ДЛЯ СТАТИСТИКИ ===== -->
      <!-- Сюда будет загружена статистика через JavaScript -->
      <div id="stats-info" style="margin-top: 20px;"></div>
    </div>

    <!-- ========== ПОДВАЛ ========== -->
    <footer style="text-align: center; margin-top: 20px; opacity: 0.6; font-size: 0.9em;">
      <p>Сделано с ♥ и усердием ✨ | Всего игроков: <span id="total-players-count">0</span></p>
    </footer>
  </div>

  <!-- Подключаем общие скрипты -->
  <script src="script.js"></script>
  
  <!-- ========== СКРИПТ ДЛЯ СТРАНИЦЫ ЛИДЕРБОРДА ========== -->
  <script>
    // ===== ПЕРЕМЕННЫЕ =====
    let currentTheme = localStorage.getItem('gameTheme') || 'dark';  // Текущая тема
    
    // ===== ФУНКЦИИ ДЛЯ ТЕМЫ =====
    
    /**
     * Инициализация темы при загрузке
     */
    function initTheme() {
      document.body.className = `theme-${currentTheme}`;
      
      const buttons = document.querySelectorAll('.theme-btn');
      buttons.forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.theme === currentTheme) {
          btn.classList.add('active');
        }
      });
      
      const switcher = document.getElementById('theme-switcher');
      if (switcher) {
        switcher.addEventListener('click', (e) => {
          if (e.target.classList.contains('theme-btn')) {
            const theme = e.target.dataset.theme;
            setTheme(theme);
          }
        });
      }
    }
    
    /**
     * Установка темы
     */
    function setTheme(themeName) {
      document.body.className = `theme-${themeName}`;
      currentTheme = themeName;
      localStorage.setItem('gameTheme', themeName);
      
      const buttons = document.querySelectorAll('.theme-btn');
      buttons.forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.theme === themeName) {
          btn.classList.add('active');
        }
      });
      
      SoundManager.click();
    }
    
    // ===== ФУНКЦИИ ДЛЯ ЛИДЕРБОРДА =====
    
    /**
     * Загрузка и отображение таблицы лидеров
     */
    function loadLeaderboard() {
      const container = document.getElementById('leaderboard-container');
      
      // Получаем всех игроков из LeaderboardManager
      let players = LeaderboardManager.getAllPlayers();
      
      // Обновляем счетчик игроков в подвале
      const totalPlayersSpan = document.getElementById('total-players-count');
      if (totalPlayersSpan) {
        totalPlayersSpan.textContent = players.length;
      }

      // Если игроков нет — показываем заглушку
      if (players.length === 0) {
        container.innerHTML = `
          <div class="empty-leaderboard">
            <h3>Таблица лидеров пуста</h3>
            <p>Пока никто не играл в игру. Будьте первым!</p>
            <button class="btn" onclick="window.location.href='index.html'" style="background:var(--secondary)">
              🎮 Начать играть
            </button>
          </div>
        `;
        updateStats(players);
        return;
      }

      // Формируем HTML для таблицы
      let html = `
        <div class="leaderboard-full-container">
          <!-- Заголовок таблицы -->
          <div class="leaderboard-header">
            <div>🏆 Место</div>
            <div>👤 Игрок</div>
            <div style="text-align: right;">✨ Очки</div>
            <div style="text-align: center;">🎯 Уровни</div>
            <div style="text-align: right;">⏱️ Лучшее время</div>
          </div>
          <!-- Тело таблицы (с прокруткой) -->
          <div class="leaderboard-body">
      `;

      // Для каждого игрока создаем строку
      players.forEach((player, index) => {
        // Проверяем, является ли игрок текущим пользователем
        const isCurrentUser = UserManager.user && player.name === UserManager.user.name;
        
        // Класс для медалей
        const medalClass = index === 0 ? 'medal-gold' : index === 1 ? 'medal-silver' : index === 2 ? 'medal-bronze' : '';
        
        // Иконка для медалей
        const medalIcon = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}.`;

        // Получаем лучшее время игрока (минимальное из всех уровней)
        const bestTime = player.bestTimes ? Math.min(...Object.values(player.bestTimes).filter(t => t > 0)) : 0;
        const bestTimeStr = bestTime && isFinite(bestTime) ? formatTime(bestTime) : '--:--';

        // Формируем строку
        html += `
          <div class="leaderboard-row ${isCurrentUser ? 'current-user' : ''}">
            <div class="leaderboard-rank ${medalClass}">${medalIcon}</div>
            <div class="leaderboard-name">${player.name}</div>
            <div class="leaderboard-score">${player.score}</div>
            <div class="leaderboard-levels">${player.completedLevels.length}/3</div>
            <div class="leaderboard-time">${bestTimeStr}</div>
          </div>
        `;
      });

      html += `
          </div>
        </div>
      `;

      container.innerHTML = html;
      updateStats(players);
    }

    /**
     * Форматирование времени в формат М:SS
     */
    function formatTime(seconds) {
      if (!seconds || seconds <= 0) return '--:--';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    /**
     * Обновление блока статистики (горизонтальное расположение)
     */
    function updateStats(players) {
      const statsContainer = document.getElementById('stats-info');
      const totalPlayers = players.length;
      
      if (totalPlayers === 0) {
        statsContainer.innerHTML = '';
        return;
      }
      
      // Вычисляем различную статистику
      const avgScore = Math.round(players.reduce((sum, p) => sum + p.score, 0) / totalPlayers);
      const completedAll = players.filter(p => p.completedLevels.length >= 3).length;
      const totalScore = players.reduce((sum, p) => sum + p.score, 0);
      const bestPlayer = players[0];
      
      // Находим лучшее время среди всех игроков
      let bestTimeOverall = Infinity;
      players.forEach(player => {
        if (player.bestTimes) {
          const times = Object.values(player.bestTimes).filter(t => t > 0);
          if (times.length > 0) {
            const playerBest = Math.min(...times);
            if (playerBest < bestTimeOverall) {
              bestTimeOverall = playerBest;
            }
          }
        }
      });
      
      const bestTimeStr = bestTimeOverall !== Infinity ? formatTime(bestTimeOverall) : '--:--';

      // ГОРИЗОНТАЛЬНОЕ РАСПОЛОЖЕНИЕ СТАТИСТИКИ
      statsContainer.innerHTML = `
        <div class="stats-grid-horizontal">
          <!-- Всего игроков -->
          <div class="stat-item-horizontal">
            <div class="stat-label-horizontal">Всего игроков</div>
            <div class="stat-number-horizontal">${totalPlayers}</div>
            <div class="stat-desc-horizontal">участников</div>
          </div>
          
          <!-- Средний счёт -->
          <div class="stat-item-horizontal">
            <div class="stat-label-horizontal">Средний счёт</div>
            <div class="stat-number-horizontal">${avgScore}</div>
            <div class="stat-desc-horizontal">очков</div>
          </div>
          
          <!-- Прошли все уровни -->
          <div class="stat-item-horizontal">
            <div class="stat-label-horizontal">Прошли все</div>
            <div class="stat-number-horizontal">${completedAll}</div>
            <div class="stat-desc-horizontal">игроков</div>
          </div>
          
          <!-- Рекорд -->
          <div class="stat-item-horizontal">
            <div class="stat-label-horizontal">Рекорд</div>
            <div class="stat-number-horizontal">${bestPlayer ? bestPlayer.score : 0}</div>
            <div class="stat-desc-horizontal">${bestPlayer ? bestPlayer.name : ''}</div>
          </div>
          
          <!-- Лучшее время -->
          <div class="stat-item-horizontal">
            <div class="stat-label-horizontal">Лучшее время</div>
            <div class="stat-number-horizontal">${bestTimeStr}</div>
            <div class="stat-desc-horizontal">секунд</div>
          </div>
          
          <!-- Общий счёт -->
          <div class="stat-item-horizontal">
            <div class="stat-label-horizontal">Общий счёт</div>
            <div class="stat-number-horizontal">${totalScore}</div>
            <div class="stat-desc-horizontal">всех игроков</div>
          </div>
        </div>
      `;
    }

    // ===== ФУНКЦИИ ЭКСПОРТА/ИМПОРТА =====

    /**
     * Экспорт таблицы лидеров в JSON-файл
     */
    function exportLeaderboard() {
      try {
        // Получаем данные из LeaderboardManager
        const data = LeaderboardManager.exportToJSON();
        
        // Создаем Blob и ссылку для скачивания
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        
        // Создаем временную ссылку и кликаем по ней
        const a = document.createElement('a');
        a.href = url;
        a.download = `лидеры_смысл_слова_${new Date().toISOString().slice(0,10)}.json`;
        document.body.appendChild(a);
        a.click();
        
        // Очищаем
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        NotificationManager.show('✅ Таблица экспортирована успешно!', 'success', 3000);
      } catch (e) {
        NotificationManager.show('❌ Ошибка при экспорте: ' + e.message, 'error', 4000);
      }
    }

    /**
     * Импорт таблицы лидеров из JSON-файла
     */
    function importLeaderboard(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      
      reader.onload = function(e) {
        try {
          // Импортируем данные через LeaderboardManager
          const success = LeaderboardManager.importFromJSON(e.target.result);
          
          if (success) {
            // Перезагружаем таблицу
            loadLeaderboard();
            NotificationManager.show('✅ Данные успешно импортированы!', 'success', 3000);
          } else {
            NotificationManager.show('❌ Ошибка при импорте данных', 'error', 4000);
          }
        } catch (err) {
          NotificationManager.show('❌ Ошибка чтения файла: ' + err.message, 'error', 4000);
        }
        
        // Сбрасываем input
        event.target.value = '';
      };
      
      reader.readAsText(file);
    }

    /**
     * Очистка таблицы лидеров
     */
    function clearLeaderboard() {
      if (confirm("Вы уверены, что хотите полностью очистить таблицу лидеров? Это действие нельзя отменить.")) {
        // Очищаем через LeaderboardManager
        LeaderboardManager.clearAll();
        
        NotificationManager.show('🗑️ Таблица лидеров очищена', 'warning', 3000);
        
        // Перезагружаем таблицу
        setTimeout(() => {
          loadLeaderboard();
        }, 500);
      }
    }

    // ===== ЗАГРУЗКА СТРАНИЦЫ =====
    window.onload = () => {
      // Запускаем анимированный фон
      AnimatedBackground.init();
      
      // Инициализация темы
      const savedTheme = localStorage.getItem('gameTheme') || 'dark';
      document.body.className = `theme-${savedTheme}`;
      
      // Подсветка активной кнопки темы
      const buttons = document.querySelectorAll('.theme-btn');
      buttons.forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.theme === savedTheme) {
          btn.classList.add('active');
        }
      });
      
      // Обработчик переключения темы
      const switcher = document.getElementById('theme-switcher');
      if (switcher) {
        switcher.addEventListener('click', (e) => {
          if (e.target.classList.contains('theme-btn')) {
            const theme = e.target.dataset.theme;
            document.body.className = `theme-${theme}`;
            localStorage.setItem('gameTheme', theme);
            
            buttons.forEach(btn => {
              btn.classList.remove('active');
              if (btn.dataset.theme === theme) {
                btn.classList.add('active');
              }
            });
            
            SoundManager.click();
          }
        });
      }
      
      // Загружаем таблицу лидеров
      loadLeaderboard();
    };
  </script>
</body>
</html>
