<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Уровень 2</title>
  
  <!-- Подключаем общие стили -->
  <link rel="stylesheet" href="../../style.css">
  <!-- Подключаем стили для второго уровня -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ========== АНИМИРОВАННЫЙ ФОН ========== -->
  <div id="large-header" style="background: radial-gradient(circle,rgba(63, 94, 251, 0.4) 0%, rgba(252, 70, 107, 0.4) 100%);
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;"></div>
  <canvas id="demo-canvas"></canvas>

  <!-- ========== ОСНОВНОЙ КОНТЕЙНЕР ========== -->
  <div class="container level-container">
    <!-- Карточка уровня -->
    <div class="card level2-card">
      
      <!-- ===== ИГРОВАЯ ОБЛАСТЬ ===== -->
      <div class="level-content">
        <!-- Область для падающих слов -->
        <div id="storm-area" class="storm-area"></div>
        <!-- Область для категорий -->
        <div id="categories-area" class="categories-area"></div>
      </div>
      
      <!-- Кнопка возврата в меню -->
      <button class="btn level2-menu-btn" onclick="history.back()">В меню ⬅️</button>
    </div>
  </div>
  
  <!-- Подключаем общие скрипты -->
  <script src="../../script.js"></script>
  <!-- Подключаем скрипт второго уровня -->
  <script src="script.js"></script>
  
  <!-- Запуск анимированного фона -->
  <script>
    (function() {
        AnimatedBackground.init();
    })();
  </script>
</body>
</html>
