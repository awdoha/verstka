<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Задание 2 — Лесной ролик</title>
  
  <!-- ========== СТИЛИ ДЛЯ КНОПКИ ВОЗВРАТА ========== -->
  <style>
    /* Кнопка возврата на главную страницу (такой же стиль как в задании 1) */
    .back-button {
      display: block;                    /* Чтобы занимала всю ширину */
      margin: 20px auto;                 /* Центрирование по горизонтали */
      padding: 12px 24px;                /* Внутренние отступы */
      background: #2e7d32;                /* Темно-зеленый */
      color: white;                       /* Белый текст */
      text-decoration: none;              /* Убираем подчеркивание */
      font-weight: 700;                   /* Жирный */
      border-radius: 8px;                 /* Скругление */
      text-align: center;                 /* Текст по центру */
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);  /* Тень */
      transition: background 0.3s ease;   /* Плавное изменение */
    }
    .back-button:hover {
      background: #1b5e20;                /* Темнее при наведении */
    }
  </style>
  
  <!-- Подключаем внешний CSS-файл со всеми стилями сцены -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- КНОПКА ВОЗВРАТА НА ГЛАВНУЮ -->
  <a href="../index.html" class="back-button">← Вернуться на сайт</a>

  <!-- ШАПКА С ИНФОРМАЦИЕЙ О СТУДЕНТЕ -->
  <header style="text-align: center; padding: 15px; background: #006064; color: white;">
    Костин Даниил, группа з5130903/30301
  </header>

  <!-- ОСНОВНОЙ КОНТЕНТ -->
  <main>
    <!-- ========== КОНТЕЙНЕР СЦЕНЫ ========== -->
    <!-- Все элементы позиционируются относительно этого блока -->
    <!-- Именно на него навешиваются :hover и :active эффекты -->
    <div class="scene" id="scene">
      
      <!-- ========== ФОН ========== -->
      <!-- Изображение леса (самый нижний слой) -->
      <div class="background"></div>

      <!-- ========== ОБЛАКА ========== -->
      <!-- Два облака, которые появляются при наведении -->
      <div class="cloud cloud1"></div>
      <div class="cloud cloud2"></div>

      <!-- ========== ДЕРЕВО (ЁЛКА) ========== -->
      <!-- Качается при наведении -->
      <div class="tree"></div>

      <!-- ========== ЛИСА ========== -->
      <!-- Выбегает при наведении -->
      <div class="fox"></div>

      <!-- ========== СОЛНЦЕ ========== -->
      <!-- Появляется и катится при нажатии -->
      <div class="sun"></div>

      <!-- ========== ТЕКСТОВЫЕ ПОДСКАЗКИ ========== -->
      <!-- Два текста, переключаются при наведении/нажатии -->
      <div class="label label-hover">Санаторий "Родные просторы"</div>
      <div class="label label-active">Лучший отдых</div>
    </div>
  </main>

  <!-- ПОДВАЛ -->
  <footer style="text-align: center; padding: 10px; background: #004d40; color: white;">
    © 2026 Задание 2 — Лесной ролик | Создано для курса «Верстка и прототипирование сайтов»
  </footer>
</body>
</html>
